name: Manutencao - copia aninhada (temporario)

# Roda uma vez: compara public_html/public_html (copia aninhada) com public_html (site)
# e MOVE a copia para fora da pasta publica (nao apaga). Este arquivo sai do repo depois.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manutencao-copia-aninhada.yml'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  copia-aninhada:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      LIVE: public_html/
      NESTED: public_html/public_html/
      DEST: copia-aninhada-public_html-2026-11-10
    steps:
      - name: Comparar e mover
        run: |
          HOST="${FTP_HOST#ftp://}"; HOST="${HOST%/}"
          C=(curl -sS --ssl-reqd --connect-timeout 20 --max-time 60 --retry 2 --user "$FTP_USER:$FTP_PASSWORD")
          # "LIST" em formato ls -l: tipo, tamanho e nome
          ls_l() { "${C[@]}" "ftp://$HOST/$1" 2>/dev/null | tr -d '\r' | awk '$9!="." && $9!=".." {t=substr($1,1,1); n=$9; for(i=10;i<=NF;i++) n=n" "$i; print t"\t"$5"\t"n}'; }

          # Confere a raiz do login: precisa ter public_html com o site e a copia dentro
          # Descobre a pasta do site a partir do login (mesmos candidatos do deploy)
          LIVE=""
          for cand in "public_html/" "domains/coordly.co/public_html/"; do
            if "${C[@]}" --list-only "ftp://$HOST/$cand" 2>/dev/null | tr -d '\r' | grep -qx 'wp-config.php'; then LIVE="$cand"; break; fi
          done
          [ -n "$LIVE" ] || { echo "::error::public_html do site nao encontrado"; exit 1; }
          NESTED="${LIVE}public_html/"
          DEST="${LIVE%public_html/}${DEST}"
          echo "Site: /$LIVE  Copia: /$NESTED  Destino: /$DEST"
          echo "LIST bruto de /$LIVE (3 linhas):"; "${C[@]}" "ftp://$HOST/$LIVE" 2>&1 | head -3 || true
          echo "Interpretado:"; ls_l "$LIVE" | head -3 || true
          ls_l "$LIVE" | cut -f3 | grep -qx 'wp-config.php' || { echo "::error::nao consegui interpretar o LIST"; exit 1; }
          ls_l "$NESTED" | cut -f3 | grep -qx 'wp-config-local.php' || { echo "::error::copia aninhada nao encontrada (ja movida?)"; exit 1; }
          ls_l "${LIVE%public_html/}" | cut -f3 | grep -qx "${DEST##*/}" && { echo "::error::$DEST ja existe"; exit 1; }

          # Pastas comparadas (as que podem ter conteudo proprio)
          DIRS=("" "wp-content/" "wp-content/plugins/" "wp-content/themes/" "wp-content/mu-plugins/" "wp-content/uploads/")
          for y in $(ls_l "${NESTED}wp-content/uploads/" | awk -F'\t' '$1=="d" && $3 ~ /^[0-9]{4}$/ {print $3}'); do
            DIRS+=("wp-content/uploads/$y/")
            for m in $(ls_l "${NESTED}wp-content/uploads/$y/" | awk -F'\t' '$1=="d" {print $3}'); do DIRS+=("wp-content/uploads/$y/$m/"); done
          done

          total=0; so_copia=0; diferente=0; falhas=0
          parse() { tr -d '\r' < "$1" | awk '$9!="." && $9!=".." {t=substr($1,1,1); n=$9; for(i=10;i<=NF;i++) n=n" "$i; print t"\t"$5"\t"n}' | sort -t$'\t' -k3; }
          for d in "${DIRS[@]}"; do
            echo "-- /$d"
            if ! "${C[@]}" "ftp://$HOST/${NESTED}$d" > n.raw 2>/dev/null || ! "${C[@]}" "ftp://$HOST/${LIVE}$d" > l.raw 2>/dev/null; then
              falhas=$((falhas+1)); echo "ERRO AO LISTAR /$d (nao comparado)"; continue
            fi
            parse n.raw > n.txt; parse l.raw > l.txt
            while IFS=$'\t' read -r t s n; do
              total=$((total+1))
              ls=$(awk -F'\t' -v n="$n" '$3==n {print $1"\t"$2}' l.txt)
              if [ -z "$ls" ]; then so_copia=$((so_copia+1)); echo "SO NA COPIA: $d$n ($t, $s B)";
              elif [ "$t" = "-" ] && [ "${ls#*$'\t'}" != "$s" ]; then diferente=$((diferente+1)); echo "TAMANHO DIFERENTE: $d$n (copia $s B, site ${ls#*$'\t'} B)"; fi
            done < n.txt
          done
          echo "Resumo: $total itens verificados na copia; $so_copia so existem na copia; $diferente com tamanho diferente; $falhas pastas nao listadas."

          # Move a copia para fora da pasta publica (reversivel)
          "${C[@]}" -o /dev/null -Q "RNFR ${NESTED%/}" -Q "RNTO $DEST" "ftp://$HOST/"
          ls_l "${LIVE%public_html/}" | cut -f3 | grep -qx "${DEST##*/}" && echo "Copia movida para /$DEST (fora do public_html)."
          ls_l "$LIVE" | cut -f3 | grep -qx 'public_html' && { echo "::error::public_html/public_html ainda existe"; exit 1; } || true
