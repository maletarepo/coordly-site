name: CI/CD

on:
  pull_request:
    paths:
      - 'wp-content/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'wp-content/**'
      - '.github/workflows/**'
  workflow_dispatch:

# Nunca dois deploys ao mesmo tempo
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  lint:
    name: Verificar sintaxe PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: php -l em todos os arquivos
        run: |
          if ! find wp-content -type f -name '*.php' -print0 | xargs -0 -n1 php -l > lint.txt 2>&1; then
            grep -v '^No syntax errors detected' lint.txt
            exit 1
          fi
          echo "$(wc -l < lint.txt) arquivos PHP sem erros de sintaxe"

  deploy:
    name: Deploy para coordly.co (FTP)
    needs: lint
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://coordly.co
    env:
      PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
    steps:
      - uses: actions/checkout@v5

      # Trava de seguranca: descobre a raiz do site a partir do login FTP e so publica
      # se o tema ja existir la (style.css). Assim nunca cria wp-content no lugar errado.
      # FTP_SITE_ROOT (variavel opcional) fixa a raiz; sem ela, testa os caminhos comuns da Hostinger.
      - name: Conferir destino no servidor
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT_OVERRIDE: ${{ vars.FTP_SITE_ROOT }}
        run: |
          HOST="${FTP_HOST#ftp://}"; HOST="${HOST%/}"
          TLS=""; [ "$PROTOCOL" = "ftps" ] && TLS="--ssl-reqd"
          ftp_ls() { curl -sS $TLS --list-only --user "$FTP_USER:$FTP_PASSWORD" "ftp://$HOST/$1" | tr -d '\r'; }

          if [ -n "$ROOT_OVERRIDE" ]; then
            CANDIDATES=("${ROOT_OVERRIDE%/}/")
          else
            CANDIDATES=("" "public_html/" "domains/coordly.co/public_html/")
          fi

          for ROOT in "${CANDIDATES[@]}"; do
            DIR="${ROOT}wp-content/themes/CoordlyWPTheme/"
            if ftp_ls "$DIR" 2>/dev/null | grep -qx 'style.css'; then
              echo "Destino confirmado: /${DIR}"
              echo "SITE_ROOT=${ROOT}" >> "$GITHUB_ENV"
              echo "FTP_SERVER=${HOST}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Nao e aqui: /${DIR}"
          done

          echo "Pastas na raiz do login FTP:"
          ftp_ls "" || true
          echo "::error::Nao encontrei o tema em nenhum caminho testado. Deploy cancelado; defina FTP_SITE_ROOT."
          exit 1

      # Envia so o que mudou desde o ultimo deploy (estado guardado no servidor).
      # Arquivos que nao estao no repositorio (ex.: hostinger-auto-updates.php) nunca sao apagados.
      - name: Tema CoordlyWPTheme
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ env.PROTOCOL }}
          security: strict
          local-dir: ./wp-content/themes/CoordlyWPTheme/
          server-dir: ${{ env.SITE_ROOT }}wp-content/themes/CoordlyWPTheme/

      - name: mu-plugins
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ env.PROTOCOL }}
          security: strict
          local-dir: ./wp-content/mu-plugins/
          server-dir: ${{ env.SITE_ROOT }}wp-content/mu-plugins/
          exclude: |
            **/.git*
            **/.git*/**
            hostinger-auto-updates.php

      - name: Lembrete
        run: echo "::notice::Deploy concluido. Limpe o cache em hPanel > Avancado > Gerenciador de cache (ou LiteSpeed no wp-admin)."
