name: CI/CD

on:
  pull_request:
    paths:
      - 'wp-content/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'wp-content/**'
      - '.github/workflows/**'
  workflow_dispatch:

# Nunca dois deploys ao mesmo tempo
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  lint:
    name: Verificar sintaxe PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: php -l em todos os arquivos
        run: |
          if ! find wp-content -type f -name '*.php' -print0 | xargs -0 -n1 php -l > lint.txt 2>&1; then
            grep -v '^No syntax errors detected' lint.txt
            exit 1
          fi
          echo "$(wc -l < lint.txt) arquivos PHP sem erros de sintaxe"

  deploy:
    name: Deploy para coordly.co (FTP)
    needs: lint
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://coordly.co
    env:
      PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # historico completo para comparar com o ultimo deploy

      # Trava de seguranca: descobre a raiz do site a partir do login FTP e so publica
      # numa pasta que o site realmente serve. Para cada caminho candidato com o tema (style.css),
      # grava um arquivo de teste e busca esse arquivo por HTTPS em SITE_URL; so aceita se ele aparecer.
      # FTP_SITE_ROOT (variavel opcional) fixa a raiz; sem ela, testa os caminhos comuns da Hostinger.
      - name: Conferir destino no servidor
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT_OVERRIDE: ${{ vars.FTP_SITE_ROOT }}
          SITE_URL: ${{ vars.SITE_URL || 'https://coordly.co' }}
          FTP_IP_FROM: ${{ vars.FTP_IP_FROM || 'ftp.coordly.co' }}
        run: |
          HOST="${FTP_HOST#ftp://}"; HOST="${HOST%/}"
          TLS=""; [ "$PROTOCOL" = "ftps" ] && TLS="--ssl-reqd"
          # O certificado FTPS e *.hstgr.io: o TLS continua validado pelo nome em FTP_HOST,
          # mas a conexao vai para o IP do servidor do site (o de ftp.coordly.co, mostrado no hPanel).
          # srv1549.hstgr.io aponta para outra maquina, com uma copia antiga que o site nao serve.
          FTP_IP="$(getent ahostsv4 "$FTP_IP_FROM" | awk 'NR==1{print $1}')"
          [ -n "$FTP_IP" ] || { echo "::error::Nao resolvi $FTP_IP_FROM"; exit 1; }
          echo "Conectando em $HOST (TLS) via $FTP_IP ($FTP_IP_FROM)"
          CONNECT="$HOST:21:$FTP_IP:21"
          CURL=(curl -sS $TLS --connect-to "$CONNECT" --user "$FTP_USER:$FTP_PASSWORD")
          ftp_ls() { "${CURL[@]}" --list-only "ftp://$HOST/$1" | tr -d '\r'; }
          THEME="wp-content/themes/CoordlyWPTheme/"

          if [ -n "$ROOT_OVERRIDE" ]; then
            CANDIDATES=("${ROOT_OVERRIDE%/}/")
          else
            CANDIDATES=("" "public_html/" "domains/coordly.co/public_html/")
          fi

          TOKEN="$(cat /proc/sys/kernel/random/uuid)"
          PROBE="deploy-probe-${GITHUB_RUN_ID}.txt"
          printf '%s' "$TOKEN" > "$PROBE"

          for ROOT in "${CANDIDATES[@]}"; do
            DIR="${ROOT}${THEME}"
            if ! ftp_ls "$DIR" 2>/dev/null | grep -qx 'style.css'; then
              echo "Sem o tema: /${DIR}"
              continue
            fi
            "${CURL[@]}" -T "$PROBE" "ftp://$HOST/${DIR}${PROBE}"
            GOT="$(curl -sS -L --max-time 20 -H 'Cache-Control: no-cache' "${SITE_URL%/}/${THEME}${PROBE}?nocache=$TOKEN" || true)"
            "${CURL[@]}" -o /dev/null -Q "*DELE ${DIR}${PROBE}" "ftp://$HOST/" || true
            if [ "$GOT" = "$TOKEN" ]; then
              echo "Destino confirmado (o site serve esta pasta): /${DIR}"
              echo "SITE_ROOT=${ROOT}" >> "$GITHUB_ENV"
              echo "FTP_SERVER=${HOST}" >> "$GITHUB_ENV"
              echo "FTP_CONNECT=${CONNECT}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Tem o tema, mas NAO e a pasta servida por ${SITE_URL}: /${DIR}"
          done

          echo "Pastas na raiz do login FTP:"
          ftp_ls "" || true
          for d in public_html domains; do echo "--- /$d:"; ftp_ls "$d/" 2>&1 | head -50 || true; done
          echo "::error::Nenhum caminho testado e servido por ${SITE_URL}. Deploy cancelado; defina FTP_SITE_ROOT com o caminho certo."
          exit 1

      # Envia so o que mudou no Git desde o ultimo deploy. O commit publicado fica em
      # .deploy-rev na pasta do tema no servidor. Sem ele (primeiro deploy), envia tudo.
      # So apaga no servidor o que foi apagado no Git: arquivos fora do repositorio
      # (ex.: hostinger-auto-updates.php) nunca sao tocados.
      # Usa curl (FTPS com certificado validado), que funciona com o FTP da Hostinger.
      - name: Publicar alteracoes
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -o pipefail
          PATHS=(wp-content/themes/CoordlyWPTheme wp-content/mu-plugins)
          THEME_REMOTE="${SITE_ROOT}wp-content/themes/CoordlyWPTheme"
          TLS=""; [ "$PROTOCOL" = "ftps" ] && TLS="--ssl-reqd"
          CURL=(curl -sS $TLS --connect-to "$FTP_CONNECT" --user "$FTP_USER:$FTP_PASSWORD" --retry 2)
          enc() { python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe="/"))' "$1"; }

          PREV=$("${CURL[@]}" "ftp://$FTP_SERVER/$(enc "$THEME_REMOTE/.deploy-rev")" 2>/dev/null | tr -d '\r\n ' || true)
          if [ -n "$PREV" ] && git cat-file -e "${PREV}^{commit}" 2>/dev/null; then
            echo "Ultimo deploy: $PREV -> agora: $GITHUB_SHA"
            git diff -z --no-renames --name-only --diff-filter=ACMT "$PREV" HEAD -- "${PATHS[@]}" > upload.lst
            git diff -z --no-renames --name-only --diff-filter=D "$PREV" HEAD -- "${PATHS[@]}" > delete.lst
          else
            echo "Sem .deploy-rev valido no servidor: primeiro deploy, envia todos os arquivos versionados."
            git ls-files -z -- "${PATHS[@]}" > upload.lst
            : > delete.lst
          fi

          # Monta um arquivo de config do curl (um par upload-file/url por arquivo, mesma conexao)
          SITE_ROOT="$SITE_ROOT" FTP_SERVER="$FTP_SERVER" python3 - <<'PY'
          import os, urllib.parse
          root, host = os.environ["SITE_ROOT"], os.environ["FTP_SERVER"]
          files = [f for f in open("upload.lst", "rb").read().decode("utf-8").split("\0") if f]
          esc = lambda s: s.replace("\\", "\\\\").replace('"', '\\"')
          with open("upload.cfg", "w", encoding="utf-8") as cfg:
              for f in files:
                  url = f"ftp://{host}/" + urllib.parse.quote(root + f, safe="/")
                  cfg.write(f'upload-file = "{esc(f)}"\nurl = "{esc(url)}"\n')
          print(f"Arquivos para enviar: {len(files)}")
          PY

          if [ -s upload.cfg ]; then
            "${CURL[@]}" --ftp-create-dirs --fail-early -w 'enviado: %{url_effective}\n' -K upload.cfg | sed "s#ftp://$FTP_SERVER/##"
          fi

          while IFS= read -r -d '' f; do
            echo "apagando: ${SITE_ROOT}$f"
            "${CURL[@]}" -o /dev/null -Q "*DELE ${SITE_ROOT}$f" "ftp://$FTP_SERVER/"
          done < delete.lst

          printf '%s\n' "$GITHUB_SHA" > .deploy-rev
          "${CURL[@]}" -T .deploy-rev "ftp://$FTP_SERVER/$(enc "$THEME_REMOTE/.deploy-rev")"
          echo "Publicado: $GITHUB_SHA"

      - name: Lembrete
        run: echo "::notice::Deploy concluido. Limpe o cache em hPanel > Avancado > Gerenciador de cache (ou LiteSpeed no wp-admin)."
